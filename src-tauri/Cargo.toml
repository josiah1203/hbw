[package]
name = "hbw"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HummingBird Workbench shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hbw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
